services:
  hub:
    build:
      # Raíz del clon del repositorio. Dentro del repo vale `../..`; en Dockge se pega este archivo
      # sin cambios y se fija DYNDNSARR_SRC=/ruta/del/clon en el .env del stack (§12).
      context: ${DYNDNSARR_SRC:-../..}
      dockerfile: apps/hub/Dockerfile
    image: dyndnsarr-hub:local
    restart: unless-stopped
    # Por defecto solo escucha en el propio servidor. Para la LAN, fija
    # DYNDNSARR_HUB_BIND a la IP LAN del servidor (ver docs/operations.md).
    # El Hub habla HTTP: el Agent le envía su token, así que publícalo solo en loopback o en la
    # red del proxy TLS (Caddy) que va delante; nunca directo a la LAN (docs/operations.md §6).
    ports:
      - "${DYNDNSARR_HUB_BIND:-127.0.0.1}:${DYNDNSARR_HUB_PORT:-8000}:8000"
      # Puerto de enlace HTTPS propio para los Agents (slice 8, §12): solo /api/v1 y /pair/v1. Este
      # sí va a la IP LAN del servidor (DYNDNSARR_HUB_LINK_BIND); sin LINK_NAMES no escucha.
      - "${DYNDNSARR_HUB_LINK_BIND:-127.0.0.1}:${DYNDNSARR_HUB_LINK_PORT:-8443}:8443"
    environment:
      DYNDNSARR_HUB_LOG_LEVEL: ${DYNDNSARR_HUB_LOG_LEVEL:-INFO}
      # IPs/nombres LAN del servidor, separados por comas: van al certificado del puerto de enlace
      # (CA propia en /data). El Agent usa uno de ellos en la `url` de [hub].
      DYNDNSARR_HUB_LINK_NAMES: ${DYNDNSARR_HUB_LINK_NAMES:-}
      # Código de emparejamiento (openssl rand -hex 16), el mismo que en el Agent. Un solo uso.
      DYNDNSARR_HUB_PAIRING_CODE: ${DYNDNSARR_HUB_PAIRING_CODE:-}
      # CA que firma los certificados de los Agents (slice 3b, camino manual; un Agent emparejado
      # usa la suya). Vive en el volumen /data y no en un bind mount: si el archivo no existe,
      # Docker crearía un directorio (docs/operations.md §7.1).
      DYNDNSARR_HUB_AGENT_CA_FILE: ${DYNDNSARR_HUB_AGENT_CA_FILE:-/data/agent-ca.pem}
      # Landing pública (slice 4, docs/operations.md §8). SHOW_DOMAINS añade el nombre del registro,
      # que resuelve a la IP completa en el DNS público: déjalo en false salvo decisión explícita.
      DYNDNSARR_HUB_PUBLIC_ENABLED: ${DYNDNSARR_HUB_PUBLIC_ENABLED:-true}
      DYNDNSARR_HUB_PUBLIC_SHOW_DOMAINS: ${DYNDNSARR_HUB_PUBLIC_SHOW_DOMAINS:-false}
      DYNDNSARR_HUB_STATUS_REFRESH_SECONDS: ${DYNDNSARR_HUB_STATUS_REFRESH_SECONDS:-60}
      # Origen HTTPS visto por el navegador. Vacío: login deshabilitado hasta configurarlo (§9).
      DYNDNSARR_HUB_ADMIN_ORIGIN: ${DYNDNSARR_HUB_ADMIN_ORIGIN:-}
      DYNDNSARR_HUB_INTEGRATIONS_ENABLED: ${DYNDNSARR_HUB_INTEGRATIONS_ENABLED:-false}
      DYNDNSARR_HUB_ALERTS_FILE: ${DYNDNSARR_HUB_ALERTS_FILE:-}
      DYNDNSARR_HUB_WEBHOOK_URL: ${DYNDNSARR_HUB_WEBHOOK_URL:-}
      DYNDNSARR_HUB_SMTP_USER: ${DYNDNSARR_HUB_SMTP_USER:-}
      DYNDNSARR_HUB_SMTP_PASSWORD: ${DYNDNSARR_HUB_SMTP_PASSWORD:-}
      DYNDNSARR_HUB_RETENTION_DAYS: ${DYNDNSARR_HUB_RETENTION_DAYS:-365}
      DYNDNSARR_HUB_RECEIPTS_DAYS: ${DYNDNSARR_HUB_RECEIPTS_DAYS:-400}
      DYNDNSARR_HUB_HOMARR_ORIGIN: ${DYNDNSARR_HUB_HOMARR_ORIGIN:-}
      DYNDNSARR_HUB_APPLICATION_URL: ${DYNDNSARR_HUB_APPLICATION_URL:-}
      DYNDNSARR_HUB_SERVICES_ENABLED: ${DYNDNSARR_HUB_SERVICES_ENABLED:-false}
      DYNDNSARR_HUB_GATEWAY_FILE: ${DYNDNSARR_HUB_GATEWAY_FILE:-}
      DYNDNSARR_HUB_GATEWAY_CA_FILE: ${DYNDNSARR_HUB_GATEWAY_CA_FILE:-}
      DYNDNSARR_HUB_GATEWAY_TOKEN: ${DYNDNSARR_HUB_GATEWAY_TOKEN:-}
    volumes:
      - hub-data:/data

volumes:
  hub-data:
