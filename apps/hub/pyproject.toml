[project]
name = "dyndnsarr-hub"
dynamic = ["version"]
description = "DynDNSarr hub"
requires-python = ">=3.11"
dependencies = [
    "dyndnsarr-shared",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
dyndnsarr-hub = "dyndnsarr_hub.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "dyndnsarr_hub",
    "dyndnsarr_hub.api",
    "dyndnsarr_hub.auth",
    "dyndnsarr_hub.db",
]

[tool.setuptools.package-data]
"dyndnsarr_hub.db" = ["migrations/*.sql"]

[tool.setuptools.dynamic]
version = { attr = "dyndnsarr_hub.__version__" }
