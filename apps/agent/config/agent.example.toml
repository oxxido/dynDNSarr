# Configuración del motor DDNS del Agent (sin secretos).
# Se activa con DYNDNSARR_AGENT_CONFIG_FILE=/etc/dyndnsarr/agent.toml

# Segundos entre comprobaciones (mínimo 60).
check_interval_seconds = 300

[ip_sources]
# Mínimo 2 fuentes HTTPS independientes que devuelvan la IPv4 pública como texto.
urls = ["https://api.ipify.org", "https://ipv4.icanhazip.com"]

[dns]
# Resolvers externos a los que se pregunta: "ip" o "ip:puerto".
resolvers = ["1.1.1.1", "8.8.8.8"]

[retention]
samples_days = 30     # muestras de IP y comprobaciones DNS
events_days = 365

[update]
# Solo cuentan para registros "managed". La propagación del DNS puede tardar: tras aceptar la
# actualización el registro queda `pending_verification` y se comprueba cada `verify_retry_seconds`
# hasta `verify_timeout_seconds` (valor prudente, no medido).
verify_retry_seconds = 60       # mínimo 1
verify_timeout_seconds = 900    # no menor que verify_retry_seconds

# Con la API de control (slice 3b, docs/operations.md §7) el Hub puede sustituir las secciones
# check_interval_seconds, ip_sources, dns, retention, update y records de este archivo.
# [providers] y [hub] son siempre locales. `dyndnsarr-agent config-reset` vuelve a este TOML.

# Enlace con el Hub. Opcional: sin esta sección no hay entrega de eventos. Un Hub inaccesible
# nunca impide arrancar.
# - Instalación asistida (slice 8, docs/operations.md §12): `url` es el puerto de enlace del Hub
#   y basta con el código de emparejamiento en agent.env; sin `ca_file`.
# - Camino manual (slice 3a, §6): token en DYNDNSARR_AGENT_HUB_TOKEN y `ca_file` del proxy TLS.
# [hub]
# url = "https://192.168.1.10:8443"       # https; http solo a localhost/127.0.0.1 (pruebas)
# agent_id = "raspberry-home"             # nombre de este Agent en el Hub
# ca_file = "/etc/dyndnsarr/hub-ca.pem"   # solo camino manual: CA que firma el proxy del Hub

# [providers.dondominio]
# url = "https://dondns.dondominio.com/json/"   # solo se cambia para pruebas (http solo a localhost)

[[records]]
name = "home.example.com"
mode = "monitored"    # solo se observa; nunca se escribe
enabled = true

# Un registro "managed" se actualiza en DonDominio cuando la IP pública confirmada difiere de lo
# que resuelven los resolvers. El registro A debe existir ya en la zona (no un CNAME). Necesita
# DYNDNSARR_AGENT_DONDOMINIO_USER y DYNDNSARR_AGENT_DONDOMINIO_KEY en agent.env (nunca aquí).
# [[records]]
# name = "ddns.example.com"
# mode = "managed"
# provider = "dondominio"
