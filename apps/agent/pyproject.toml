[project]
name = "dyndnsarr-agent"
dynamic = ["version"]
description = "DynDNSarr agent"
requires-python = ">=3.11"
dependencies = [
    "dyndnsarr-shared",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.3,<3",
]

[project.scripts]
dyndnsarr-agent = "dyndnsarr_agent.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "dyndnsarr_agent",
    "dyndnsarr_agent.api",
    "dyndnsarr_agent.db",
]

[tool.setuptools.package-data]
"dyndnsarr_agent.db" = ["migrations/*.sql"]

[tool.setuptools.dynamic]
version = { attr = "dyndnsarr_agent.__version__" }
