# Configuración del workspace (ruff, pytest) y extra `dev`.
# Los paquetes instalables viven en packages/shared, apps/agent y apps/hub.
[project]
name = "dyndnsarr-workspace"
version = "0.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "trustme>=1.1,<2",
]

[tool.setuptools]
packages = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["design_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["dyndnsarr_shared", "dyndnsarr_agent", "dyndnsarr_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = ["e2e: arranca los componentes como procesos reales"]
